name: Frontend CI
on:
  push:
    branches:
      [main, "feat/**", "fix/**", "test/**", "ci/**", "docs/**", "chore/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser and system dependencies
        timeout-minutes: 8
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser journeys and accessibility
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
